<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>কাস্টমার ইনফো ফর্ম</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 0;
    }

    .form-container {
      max-width: 700px;
      margin: 30px auto;
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input[type="text"],
    input[type="email"],
    input[type="url"],
    input[type="file"],
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    textarea {
      resize: vertical;
      height: 80px;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background-color: #2ecc71;
      color: white;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #27ae60;
    }

    @media (max-width: 600px) {
      .form-container {
        padding: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>📋 ক্লায়েন্ট ওয়েবসাইট ইনফো ফর্ম</h2>

    <form action="#" method="post" enctype="multipart/form-data">
      <label>কোম্পানির নাম:</label>
      <input type="text" name="company_name" required>

      <label>মোবাইল নম্বর:</label>
      <input type="text" name="phone" required>

      <label>ইমেইল ঠিকানা:</label>
      <input type="email" name="email">

      <label>ঠিকানা:</label>
      <textarea name="address" required></textarea>

      <label>Facebook Page Link:</label>
<input type="url" name="facebook" placeholder="https://facebook.com/yourpage">

<label>YouTube Link:</label>
<input type="url" name="youtube" placeholder="https://youtube.com/yourchannel">

<label>Instagram:</label>
<input type="url" name="instagram" placeholder="https://instagram.com/yourprofile">

<label>LinkedIn:</label>
<input type="url" name="linkedin" placeholder="https://linkedin.com/in/yourprofile">

<label>TikTok:</label>
<input type="url" name="tiktok" placeholder="https://tiktok.com/@yourusername">


      <label>লোগো আপলোড করুন:</label>
      <input type="file" name="logo" accept="image/*">

      <label>ফেভিকন আপলোড করুন:</label>
      <input type="file" name="favicon" accept="image/*">

      <label>কপিরাইট টেক্সট:</label>
      <input type="text" name="copyright" placeholder="যেমন: © 2025 Company Name. All rights reserved.">

      <label>সার্ভিস বা পণ্যের তালিকা:</label>
      <textarea name="services"></textarea>

      <label>রঙের পছন্দ:</label>
      <input type="text" name="color_theme" placeholder="যেমন: সবুজ ও সাদা">

      <label>পছন্দের ওয়েবসাইট রেফারেন্স (যদি থাকে):</label>
      <input type="url" name="reference_website">

      <label>অন্যান্য তথ্য:</label>
      <textarea name="others"></textarea>

      <button type="submit">✅ তথ্য সাবমিট করুন</button>
    </form>
  </div>

</body>
</html>
